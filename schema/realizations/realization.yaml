name: str()
docker: include('docker', required=False)
routeros: include('routeros', required=False)

---
docker:
  networkDriver: str(required=False)
  networks: map(include('docker_network'), required=False)

---
docker_network:
  parent: str()
  ipam: include('ipam', required=False)

---
ipam:
  offset: int()
  prefixLength: int()

---
routeros:
  interfaces: map(include('routeros_interface'), required=False)

---
routeros_interface:
  physicalInterface: str()
