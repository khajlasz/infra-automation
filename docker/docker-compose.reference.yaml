# Manual reference deployment used during Docker Compose runtime prototyping.
# This file is not generated by the framework.
# PostgreSQL credentials below are demo-only values for the local lab.

---
services:

  portal:
    image: out-dialer/portal:0.1
    hostname: portal
    networks:
      dmz:
      internal:
    ports:
      - "8443:80"

  campaign:
    image: out-dialer/campaign-manager:0.1
    hostname: campaign
    networks:
      internal:
      database:
    ports:
      - "8080:80"
      - "19090:9090"

  call-simulator:
    image: out-dialer/call-simulator:0.1
    hostname: call-simulator
    networks:
      internal:
    ports:
      - "8081:80"
      - "29090:9090"

  database:
    image: postgres:17
    hostname: database
    environment:
      POSTGRES_DB: outdialer
      POSTGRES_USER: outdialer
      POSTGRES_PASSWORD: outdialer
    networks:
      database:
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

networks:
  dmz:
    name: dmz-net
    driver: macvlan
    driver_opts:
      parent: enp0s2
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
          ip_range: 10.10.10.128/28

  internal:
    name: internal-net
    driver: macvlan
    driver_opts:
      parent: enp0s3
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1
          ip_range: 10.10.20.128/28

  database:
    name: database-net
    driver: macvlan
    driver_opts:
      parent: enp0s4
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1
          ip_range: 10.10.30.128/28