name: local-lab

docker:
  hosts:
    workload:
      nodes:
        - portal
        - campaign
        - call_simulator
        - database

      networkDriver: macvlan
      networks:
        dmz:
          parent: enp0s2
          ipam:
            offset: 128
            prefixLength: 28

        internal:
          parent: enp0s3
          ipam:
            offset: 128
            prefixLength: 28

        database:
          parent: enp0s4
          ipam:
            offset: 128
            prefixLength: 28

routeros:
  interfaces:
    dmz:
      physicalInterface: ether1
    internal:
      physicalInterface: ether2
    database:
      physicalInterface: ether3
    observability:
      physicalInterface: ether4


kubernetes:
  namespace: out-dialer
  workloads:
    portal:
      application: Portal
      deployment: portal
      computeProfile: small
      replicas: 2
      imagePullPolicy: Never
      endpoints:
        http:
          application: Portal
          endpoint: http
      service:
        type: ClusterIP
      probes:
        readiness:
          path: /health
          port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        liveness:
          path: /health
          port: http
          initialDelaySeconds: 10
          periodSeconds: 10
  observability:
    metrics:
      externalInterface: metrics
      discovery: prometheus-annotations
