apiVersion: v1
kind: Service
metadata:
  name: call-simulator
  namespace: out-dialer
  labels:
    app: call-simulator
    app.kubernetes.io/part-of: out-dialer
spec:
  type: ClusterIP
  selector:
    app: call-simulator
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP