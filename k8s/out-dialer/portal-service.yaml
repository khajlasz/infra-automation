apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: out-dialer
  labels:
    app: portal
    app.kubernetes.io/part-of: out-dialer
spec:
  type: ClusterIP
  selector:
    app: portal
  ports:
    - name: http
      port: 8443
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP