apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: out-dialer
  labels:
    app: portal
    app.kubernetes.io/part-of: out-dialer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
      - name: portal
        image: out-dialer/portal:0.1
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8443
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10