apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-simulator
  namespace: out-dialer
  labels:
    app: call-simulator
    app.kubernetes.io/part-of: out-dialer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: call-simulator
  template:
    metadata:
      labels:
        app: call-simulator
    spec:
      containers:
        - name: call-simulator
          image: out-dialer/call-simulator:0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10