name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "models/**"
      - "realizations/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

jobs:
  validate:
    name: Test, generate and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Validate Out-Dialer model
        run: python src/cli.py validate models/out-dialer

      - name: Generate Docker Compose
        run: |
          python src/cli.py generate docker-compose \
            models/out-dialer \
            --realization realizations/out-dialer/local-lab.yaml \
            --output /tmp/docker-compose.yaml

      - name: Validate Docker Compose
        run: docker compose -f /tmp/docker-compose.yaml config

      - name: Generate RouterOS Terraform
        run: |
          python src/cli.py generate terraform-routeros \
            models/out-dialer \
            --realization realizations/out-dialer/local-lab.yaml \
            --output lab/terraform/routeros/generated.tf

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: lab/terraform/routeros
        run: terraform init -backend=false

      - name: Check Terraform formatting
        working-directory: lab/terraform/routeros
        run: terraform fmt -check

      - name: Validate Terraform
        working-directory: lab/terraform/routeros
        run: terraform validate
